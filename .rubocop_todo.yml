RSpec/VerifiedDoubles:
  Enabled: false

RSpec/AnyInstance:
  Exclude:
    - 'spec/dionysus/consumer/karafka_consumer_generator_spec.rb'
    - 'spec/dionysus/producer/outbox/datadog_latency_reporter_job_spec.rb'
    - 'spec/dionysus/producer/outbox/active_record_publishable_spec.rb'

Layout/LineLength:
  Exclude:
    - 'lib/dionysus.rb'
    - 'lib/dionysus/consumer/persistor.rb'
    - 'lib/dionysus/producer/genesis/streamer/standard_job.rb'
    - 'lib/dionysus/consumer/batch_events_publisher.rb'
    - 'spec/dionysus/consumer/karafka_consumer_generator_spec.rb'
    - 'spec/dionysus/producer/outbox/publisher_spec.rb'
    - 'spec/dionysus/producer/genesis_spec.rb'

Lint/NonLocalExitFromIterator:
  Exclude:
    - 'lib/dionysus/producer/karafka_responder_generator.rb'
    - 'lib/dionysus/consumer/persistor.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/dionysus/producer/karafka_responder_generator.rb'
    - 'lib/dionysus/consumer/karafka_consumer_generator.rb'
    - 'lib/dionysus/consumer/persistor.rb'

RSpec/LeakyConstantDeclaration:
  Exclude:
    - 'spec/dionysus/producer_spec.rb'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/dionysus/producer_spec.rb'

Lint/EmptyClass:
  Exclude:
    - 'lib/dionysus/consumer/synced_data.rb'
    - 'lib/dionysus/consumer/params_batch_transformations.rb'

RSpec/ScatteredSetup:
  Exclude:
    - 'spec/dionysus/producer/outbox/records_processor_spec.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/dionysus/producer/karafka_responder_generator.rb'

Metrics/BlockLength:
  Exclude:
    - 'lib/dionysus/producer/karafka_responder_generator.rb'

# `declared_attributes` and friends are Arrays of [name, options] pairs, not Hashes,
# so the cop's each_key/each_value suggestion raises NoMethodError.
Style/HashEachMethods:
  Exclude:
    - 'lib/dionysus/producer/model_serializer.rb'

# integration_spec prints progress for a long-running Kafka run; the null provider
# specs use `puts` as the sentinel proving the block was called.
RSpec/Output:
  Exclude:
    - 'spec/dionysus/utils/null_retry_provider_spec.rb'
    - 'spec/dionysus/utils/null_transaction_provider_spec.rb'
    - 'spec/integration_spec.rb'
